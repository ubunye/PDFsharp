name: Build & Package PDFsharp

on:
  push:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:
    inputs:
      packageVersion:
        description: 'Package Version override (optional, defaults to 6.2.4.1)'
        required: false
        default: '6.2.4.1'

jobs:
  build:
    name: Build & Pack PDFsharp
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Download Asset Files
        shell: pwsh
        run: |
          ./dev/download-assets.ps1

      - name: Build PDFsharp Solution
        shell: pwsh
        run: |
          $ver = if ("${{ github.event.inputs.packageVersion }}" -ne "") { "${{ github.event.inputs.packageVersion }}" } else { "6.2.4.1" }
          dotnet build --configuration Release /p:Version=$ver /p:PackageVersion=$ver

      - name: Run Unit Tests
        shell: pwsh
        run: |
          dotnet test src/foundation/src/PDFsharp/tests/PdfSharp.Tests/PdfSharp.Tests.csproj --configuration Release --no-build

      - name: Collect NuGet Packages into Flat Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nupkgs
          Get-ChildItem -Path src/foundation/nuget/src -Filter *.nupkg -Recurse | Copy-Item -Destination nupkgs/

      - name: Upload NuGet Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-6.2.4.1
          path: nupkgs/*.nupkg

      # To push directly to your Azure DevOps / private feed when ready:
      # - name: Push NuGet Packages to Private Feed
      #   shell: pwsh
      #   run: |
      #     dotnet nuget push "nupkgs/*.nupkg" --source "https://pkgs.dev.azure.com/YourOrg/_packaging/DevOps%2FUbunye/nuget/v3/index.json" --api-key "${{ secrets.AZURE_DEVOPS_PAT }}" --skip-duplicate
