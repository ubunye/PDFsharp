trigger: none
pr: none

pool: 'Default'

steps:
- script:
  displayName: 'Start Build'
- checkout: self
  lfs: true

# Strip pre-release suffix for AssemblyVersion (e.g. 1.2.3-beta → 1.2.3.0)
- powershell: |
    $clean = "$(PackageVersion)" -replace '-.*', ''
    $assemblyVer = "$clean.0"
    Write-Host "##vso[task.setvariable variable=AssemblyVer]$assemblyVer"
    Write-Host "AssemblyVer set to: $assemblyVer"
  displayName: 'Set AssemblyVersion from PackageVersion'

- task: DotNetCoreCLI@2
  displayName: 'Restore Nugets'
  inputs:
    command: 'restore'
    projects: 'PdfSharp.sln'
    feedsToUse: 'select'
    vstsFeed: 'DevOps/Ubunye'

- task: VSBuild@1
  displayName: 'Build PDFsharp'
  inputs:
    solution: 'PdfSharp.sln'
    vsVersion: '18.0'
    platform: 'any cpu'
    configuration: 'release'
    restoreNugetPackages: false
    msbuildArgs: '/p:Version=$(PackageVersion) /p:AssemblyVersion=$(AssemblyVer) /p:FileVersion=$(AssemblyVer)'

# Download .nupkg files from pipeline run → Artifacts tab instead
- task: PublishPipelineArtifact@1
  displayName: 'Upload for Manual Check'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'nuget-packages'
    publishLocation: 'pipeline'

